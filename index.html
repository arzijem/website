<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Azzurra Zingoni</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

   <!-- TOP BAR -->
<header class="az-topbar">

    <a class="az-brand" href="/">
        AZZURRA ZINGONI
    </a>

    <!-- DESKTOP / TABLET MENU -->
    <nav class="az-menu">

        <a href="/">HOME</a>
        <a href="/work/">WORK</a>
        <a href="/about/">ABOUT</a>
        <a href="/contact/">CONTACT</a>

        <div class="az-languages">
            <a href="#" class="active">EN</a>
            <span>/</span>
            <a href="#">IT</a>
        </div>

    </nav>


    <!-- MOBILE MENU BUTTON -->
    <button
        class="az-menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
    </button>

</header>


<!-- MOBILE MENU -->
<div class="az-mobile-menu">

    <nav class="az-mobile-links">
        <a href="/">HOME</a>
        <a href="/work/">WORK</a>
        <a href="/about/">ABOUT</a>
        <a href="/contact/">CONTACT</a>
    </nav>

    <div class="az-mobile-languages">
        <a href="#" class="active">EN</a>
        <span>/</span>
        <a href="#">IT</a>
    </div>

</div>

    <!-- HERO -->
    <main class="az-hero">

        <img
            class="az-hero-image"
            src="(pannello%202).jpg"
            alt=""
        >

        <div class="az-hero-overlay"></div>

        <div class="az-hero-text">
            <h1>TRACES OF THE UNSEEN</h1>
            <p>AZZURRA ZINGONI</p>
        </div>

    </main>

<!-- INTERACTIVE HOME LINKS -->

<section class="az-art-nav">

    <!-- WORK -->
    <a href="/work/" class="az-art-item az-art-work">

        <div class="az-art-title">
            <span class="az-art-outline">WORK</span>
            <span class="az-art-main">WORK</span>
        </div>

        <div class="az-symbol az-symbol-work" aria-hidden="true">
            <span class="work-line work-top"></span>
            <span class="work-line work-right"></span>
            <span class="work-line work-bottom"></span>
            <span class="work-line work-left"></span>
            <span class="work-center"></span>
        </div>

    </a>


    <!-- ABOUT -->
    <a href="/about/" class="az-art-item az-art-about">

        <div class="az-symbol az-symbol-about" aria-hidden="true">

            <div class="about-shape">
                <span class="about-circle"></span>
                <span class="about-cover"></span>
                <span class="about-line"></span>
            </div>

        </div>

        <div class="az-art-title">
            <span class="az-art-outline">ABOUT</span>
            <span class="az-art-main">ABOUT</span>
        </div>

    </a>


    <!-- CONTACT -->
    <a href="/contact/" class="az-art-item az-art-contact">

        <div class="az-art-title">
            <span class="az-art-outline">CONTACT</span>
            <span class="az-art-main">CONTACT</span>
        </div>

        <div class="az-symbol az-symbol-contact" aria-hidden="true">

            <span class="contact-left"></span>
            <span class="contact-right"></span>

            <span class="contact-meeting"></span>

        </div>

    </a>

</section>


<footer class="az-footer">
    <span>© 2026 AZZURRA ZINGONI</span>
</footer>

    <!-- NETLIFY IDENTITY -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", function (user) {
                if (!user) {
                    window.netlifyIdentity.on("login", function () {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
<script>
document.addEventListener("click", function(event) {

    const fingerprint = document.createElement("div");
    fingerprint.className = "az-fingerprint";

    fingerprint.style.left = event.clientX + "px";
    fingerprint.style.top = event.clientY + "px";

    fingerprint.innerHTML = `
        <svg viewBox="0 0 60 80" aria-hidden="true">

            <path d="M12 25 C16 8, 44 5, 50 25" />
            <path d="M9 34 C9 13, 48 5, 53 32" />
            <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />

            <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />

            <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />

            <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />

            <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />

            <path d="M47 62 C45 66, 43 69, 41 72" />

        </svg>
    `;

    document.body.appendChild(fingerprint);

    setTimeout(function() {
        fingerprint.remove();
    }, 8000);

});
</script>

</body>

</html>
