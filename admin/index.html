<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Admin</title>
    
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</head>

<body>
   
    <script>
    (function() {
        const MAX_WIDTH = 2500;
        const WEBP_QUALITY = 0.82;

        async function compressImageToWebP(file) {
            // Only compress standard images larger than 1.5MB
            if (!file.type.startsWith('image/') || file.size < 1.5 * 1024 * 1024) {
                return file;
            }

            return new Promise((resolve) => {
                const img = new Image();
                img.src = URL.createObjectURL(file);

                img.onload = () => {
                    URL.revokeObjectURL(img.src);

                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height = Math.round((height * MAX_WIDTH) / width);
                        width = MAX_WIDTH;
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob((blob) => {
                        if (!blob) {
                            resolve(file);
                            return;
                        }

                        // Sanitize filename: convert to lowercase .webp and strip spaces/parentheses
                        const cleanName = file.name
                            .replace(/\.[^/.]+$/, "")
                            .toLowerCase()
                            .replace(/[^a-z0-9_-]/g, '-')
                            .replace(/-+/g, '-') + '.webp';

                        const webpFile = new File([blob], cleanName, {
                            type: 'image/webp',
                            lastModified: Date.now()
                        });

                        console.log(`[Auto-Compress] Reduced "${file.name}" (${(file.size / 1024 / 1024).toFixed(2)} MB) -> "${cleanName}" (${(webpFile.size / 1024 / 1024).toFixed(2)} MB)`);
                        resolve(webpFile);
                    }, 'image/webp', WEBP_QUALITY);
                };

                img.onerror = () => resolve(file);
            });
        }

        // Intercept file picker inputs across the CMS UI
        document.addEventListener('change', async function(e) {
            const input = e.target;
            if (input && input.type === 'file' && input.files && input.files.length) {
                const dt = new DataTransfer();
                for (let i = 0; i < input.files.length; i++) {
                    const compressed = await compressImageToWebP(input.files[i]);
                    dt.items.add(compressed);
                }
                input.files = dt.files;
            }
        }, true);
    })();
    </script>
</body>
</html>
