backend:
  name: github
  repo: arzijem/website
  branch: main
  base_url: https://sveltia-auth.arrzije-m.workers.dev

media_folder: "assets/uploads"
public_folder: "assets/uploads"

# Native Sveltia client-side auto-compression and conversion
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: "webp"
        quality: 85
        width: 2048
        height: 2048

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    format: "json"
    fields:
      - { label: "Project Title (English)", name: "title_en", widget: "string" }
      - { label: "Project Title (Italian)", name: "title_it", widget: "string" }
      - { label: "Year", name: "year", widget: "string", required: false }
      - { label: "Grid Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Short Summary (English)", name: "summary_en", widget: "string", required: false }
      - { label: "Short Summary (Italian)", name: "summary_it", widget: "string", required: false }
      - { label: "Full Project Story (English)", name: "body_en", widget: "markdown", required: false }
      - { label: "Full Project Story (Italian)", name: "body_it", widget: "markdown", required: false }
      - label: "Gallery Pictures"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - label: "Photo"
            name: "image"
            widget: "image"

  - name: "settings"
    label: "Site Translations"
    files:
      - label: "Global Text & Menu Labels"
        name: "translations"
        file: "content/translations.json"
        fields:
          - { label: "Menu: Home (English)", name: "nav_home_en", widget: "string", default: "HOME" }
          - { label: "Menu: Home (Italian)", name: "nav_home_it", widget: "string", default: "HOME" }
          - { label: "Menu: Work (English)", name: "nav_work_en", widget: "string", default: "WORK" }
          - { label: "Menu: Work (Italian)", name: "nav_work_it", widget: "string", default: "PROGETTI" }
          - { label: "Menu: About (English)", name: "nav_about_en", widget: "string", default: "ABOUT" }
          - { label: "Menu: About (Italian)", name: "nav_about_it", widget: "string", default: "CHI SONO" }
          - { label: "Menu: Contact (English)", name: "nav_contact_en", widget: "string", default: "CONTACT" }
          - { label: "Menu: Contact (Italian)", name: "nav_contact_it", widget: "string", default: "CONTATTI" }
          - { label: "Work Page Heading (English)", name: "work_title_en", widget: "string", default: "Work" }
          - { label: "Work Page Heading (Italian)", name: "work_title_it", widget: "string", default: "Progetti" }
          - { label: "Scanner Button Text (English)", name: "scan_hold_en", widget: "string", default: "HOLD TO UNLOCK" }
          - { label: "Scanner Button Text (Italian)", name: "scan_hold_it", widget: "string", default: "TIENI PREMUTO" }
          - { label: "Project Back Button (English)", name: "back_btn_en", widget: "string", default: "← BACK TO WORK" }
          - { label: "Project Back Button (Italian)", name: "back_btn_it", widget: "string", default: "← TORNA AI PROGETTI" }
          - { label: "Footer (English)", name: "footer_text_en", widget: "string", default: "© 2026 AZZURRA ZINGONI" }
          - { label: "Footer (Italian)", name: "footer_text_it", widget: "string", default: "© 2026 AZZURRA ZINGONI" }
