<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Azzurra Zingoni</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .mv-project-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 6% 120px;
        }

        .az-back-btn {
            display: inline-block;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .az-back-btn:hover {
            color: #ffffff;
        }

        /* =========================================
           AMAZONIEN INTRO: TITLE LEFT / TEXT RIGHT
           ========================================= */
        .mv-project-intro.mv-amazonien-intro {
            display: grid;
            grid-template-columns: 1fr 1.4fr;
            gap: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 60px;
            margin-bottom: 60px;
        }

        @media (max-width: 900px) {
            .mv-project-intro.mv-amazonien-intro {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        .mv-amazonien-title h1 {
            font-size: clamp(38px, 5.5vw, 68px);
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.05;
            margin: 0;
            text-transform: uppercase;
        }

        .mv-project-summary {
            font-size: 20px;
            font-weight: 500;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 24px;
        }

        .mv-project-body {
            font-size: 16px;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.75);
            white-space: pre-line;
        }

        /* =========================================
           ARTWORK GALLERY (PREVIEW & EXPAND)
           ========================================= */
        .mv-gallery-area {
            position: relative;
            margin-top: 40px;
        }

        .mv-gallery-switch {
            display: none;
        }

        .mv-gallery-button-wrap {
            display: flex;
            justify-content: center;
            margin: 40px 0 60px;
        }

        .mv-gallery-toggle {
            cursor: pointer;
            display: inline-block;
            padding: 14px 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            font-size: 12px;
            letter-spacing: 2.5px;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .mv-gallery-toggle:hover {
            border-color: #ffffff;
            background: #ffffff;
            color: #000000;
        }

        .mv-gallery-close-text { display: none; }
        .mv-gallery-open-text { display: inline; }

        /* Blurred Preview */
        .mv-gallery-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            filter: blur(14px) brightness(0.4);
            opacity: 0.7;
            transition: filter 0.5s ease, opacity 0.5s ease;
            pointer-events: none;
        }

        @media (max-width: 800px) {
            .mv-gallery-preview {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .mv-gallery-preview-item img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 2px;
        }

        /* Full Gallery Grid */
        .mv-artworks.mv-gallery-full {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px;
        }

        @media (max-width: 768px) {
            .mv-artworks.mv-gallery-full {
                grid-template-columns: 1fr;
            }
        }

        /* Gallery Switch State */
        .mv-gallery-switch:checked ~ .mv-gallery-preview {
            display: none;
        }

        .mv-gallery-switch:checked ~ .mv-artworks.mv-gallery-full {
            display: grid;
        }

        .mv-gallery-switch:checked ~ .mv-gallery-button-wrap .mv-gallery-open-text {
            display: none;
        }

        .mv-gallery-switch:checked ~ .mv-gallery-button-wrap .mv-gallery-close-text {
            display: inline;
        }

        .mv-artwork {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .mv-artwork-frame {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0d0d12;
            border-radius: 2px;
        }

        .mv-artwork-frame img {
            width: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .mv-artwork:hover .mv-artwork-frame img {
            transform: scale(1.03);
        }

        .mv-artwork-caption {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .mv-gallery-navigation-bottom {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0 20px;
        }

        .mv-gallery-navigation-bottom a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .mv-gallery-navigation-bottom a:hover {
            color: #ffffff;
        }

        /* =========================================
           FULLSCREEN VIEWER LIGHTBOX
           ========================================= */
        .mv-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .mv-viewer.is-open {
            display: flex;
        }

        .mv-viewer-center {
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mv-viewer-image {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .mv-viewer-caption {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 14px;
            text-align: center;
        }

        .mv-viewer-close,
        .mv-viewer-prev,
        .mv-viewer-next {
            position: absolute;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 32px;
            padding: 16px;
        }

        .mv-viewer-close:hover,
        .mv-viewer-prev:hover,
        .mv-viewer-next:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .mv-viewer-close {
            top: 24px;
            right: 28px;
            font-size: 40px;
        }

        .mv-viewer-prev {
            left: 20px;
        }

        .mv-viewer-next {
            right: 20px;
        }
    </style>
</head>
<body>

    <header class="az-topbar">
        <a class="az-brand" href="index.html">AZZURRA ZINGONI</a>
        <nav class="az-menu">
            <a href="index.html" data-i18n="nav_home">HOME</a>
            <a href="work.html" style="opacity: 1; font-weight: 700;" data-i18n="nav_work">WORK</a>
            <a href="index.html#about" data-i18n="nav_about">ABOUT</a>
            <a href="index.html#contact" data-i18n="nav_contact">CONTACT</a>
            <span class="az-lang-switch">
                <button type="button" class="az-lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                <span class="az-lang-divider">/</span>
                <button type="button" class="az-lang-btn" data-lang="it" onclick="setLanguage('it')">IT</button>
            </span>
        </nav>
    </header>

    <div class="mv-project-page">
        <a href="work.html" class="az-back-btn" data-i18n="back_btn">&larr; BACK TO WORK</a>

        <main class="mv-project-content">
            <!-- AMAZONIEN INTRO (TITLE LEFT / TEXT RIGHT) -->
            <section class="mv-project-intro mv-amazonien-intro">
                <div class="mv-amazonien-title">
                    <h1 id="proj-title">Loading...</h1>
                </div>

                <div class="mv-amazonien-text">
                    <div id="proj-summary" class="mv-project-summary"></div>
                    <div id="proj-body" class="mv-project-body"></div>
                </div>
            </section>

            <!-- ARTWORK GALLERY AREA -->
            <div class="mv-gallery-area" id="gallery-start">
                <input type="checkbox" id="mv-gallery-switch" class="mv-gallery-switch">

                <div class="mv-gallery-button-wrap">
                    <label for="mv-gallery-switch" class="mv-gallery-toggle">
                        <span class="mv-gallery-open-text" id="gallery-btn-open">VIEW GALLERY</span>
                        <span class="mv-gallery-close-text" id="gallery-btn-close">CLOSE GALLERY</span>
                    </label>
                </div>

                <!-- BLURRED PREVIEW -->
                <div class="mv-gallery-preview" id="gallery-preview"></div>

                <!-- FULL GALLERY -->
                <section class="mv-artworks mv-gallery-full" id="mv-artworks">
                    <!-- Artwork items injected dynamically -->
                </section>
            </div>
        </main>
    </div>

    <!-- FULLSCREEN VIEWER -->
    <div class="mv-viewer" id="mv-viewer">
        <button class="mv-viewer-close" type="button" aria-label="Close">&times;</button>
        <button class="mv-viewer-prev" type="button" aria-label="Previous">&larr;</button>
        <div class="mv-viewer-center">
            <img class="mv-viewer-image" src="" alt="">
            <div class="mv-viewer-caption"></div>
        </div>
        <button class="mv-viewer-next" type="button" aria-label="Next">&rarr;</button>
    </div>

    <footer class="az-footer">
        <span data-i18n="footer_text">© 2026 AZZURRA ZINGONI</span>
    </footer>

    <script src="i18n.js"></script>

    <script>
        let projectData = null;
        let artworks = [];
        let currentIndex = 0;

        function cleanPath(path) {
            if (!path) return '';
            if (typeof path === 'object' && path.image) path = path.image;
            return '/' + String(path).replace(/^\.?\//, '');
        }

        function renderContent() {
            if (!projectData) return;

            const lang = localStorage.getItem('az_lang') || 'en';
            const title = (lang === 'it' ? (projectData.title_it || projectData.title_en) : (projectData.title_en || projectData.title_it)) || projectData.title || '';
            const summary = (lang === 'it' ? (projectData.summary_it || projectData.summary_en) : (projectData.summary_en || projectData.summary_it)) || projectData.summary || '';
            const body = (lang === 'it' ? (projectData.body_it || projectData.body_en) : (projectData.body_en || projectData.body_it)) || projectData.body || '';

            document.title = `${title} — Azzurra Zingoni`;
            document.getElementById('proj-title').textContent = title;
            document.getElementById('proj-summary').textContent = summary;
            document.getElementById('proj-body').textContent = body;

            // Gallery Toggle labels
            document.getElementById('gallery-btn-open').textContent = lang === 'it' ? 'MOSTRA GALLERIA' : 'VIEW GALLERY';
            document.getElementById('gallery-btn-close').textContent = lang === 'it' ? 'CHIUDI GALLERIA' : 'CLOSE GALLERY';
        }

        function buildGalleries(photos) {
            const previewContainer = document.getElementById('gallery-preview');
            const fullContainer = document.getElementById('mv-artworks');
            previewContainer.innerHTML = '';
            fullContainer.innerHTML = '';

            // 1. Preview items (up to 4 blurred)
            photos.slice(0, 4).forEach(src => {
                const item = document.createElement('div');
                item.className = 'mv-gallery-preview-item';
                item.innerHTML = `<img src="${cleanPath(src)}" alt="">`;
                previewContainer.appendChild(item);
            });

            // 2. Full artwork items
            photos.forEach(src => {
                const path = cleanPath(src);
                const a = document.createElement('a');
                a.className = 'mv-artwork';
                a.href = path;
                a.setAttribute('data-full', path);
                a.innerHTML = `
                    <div class="mv-artwork-frame">
                        <img src="${path}" alt="">
                    </div>
                `;
                fullContainer.appendChild(a);
            });

            // Add bottom return button
            const navBottom = document.createElement('div');
            navBottom.className = 'mv-gallery-navigation mv-gallery-navigation-bottom';
            const lang = localStorage.getItem('az_lang') || 'en';
            navBottom.innerHTML = `<a href="#gallery-start">${lang === 'it' ? 'TORNA ALL\'INIZIO' : 'BACK TO TOP'}</a>`;
            fullContainer.appendChild(navBottom);

            // Bind lightbox viewer
            setupViewer();
        }

        function setupViewer() {
            artworks = Array.from(document.querySelectorAll('.mv-artwork'));
            const viewer = document.getElementById('mv-viewer');
            if (!artworks.length || !viewer) return;

            const viewerImage = viewer.querySelector('.mv-viewer-image');
            const closeBtn = viewer.querySelector('.mv-viewer-close');
            const prevBtn = viewer.querySelector('.mv-viewer-prev');
            const nextBtn = viewer.querySelector('.mv-viewer-next');

            function showArtwork(index) {
                if (index < 0) index = artworks.length - 1;
                if (index >= artworks.length) index = 0;
                currentIndex = index;

                viewerImage.src = artworks[currentIndex].getAttribute('data-full');
                viewer.classList.add('is-open');
                document.body.style.overflow = 'hidden';
            }

            function closeViewer() {
                viewer.classList.remove('is-open');
                document.body.style.overflow = '';
            }

            artworks.forEach((art, idx) => {
                art.addEventListener('click', (e) => {
                    e.preventDefault();
                    showArtwork(idx);
                });
            });

            closeBtn.onclick = closeViewer;
            prevBtn.onclick = () => showArtwork(currentIndex - 1);
            nextBtn.onclick = () => showArtwork(currentIndex + 1);

            viewer.onclick = (e) => {
                if (e.target === viewer) closeViewer();
            };

            document.onkeydown = (e) => {
                if (!viewer.classList.contains('is-open')) return;
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowLeft') showArtwork(currentIndex - 1);
                if (e.key === 'ArrowRight') showArtwork(currentIndex + 1);
            };
        }

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('id');

            if (!slug) {
                window.location.href = 'work.html';
                return;
            }

            try {
                const res = await fetch(`content/projects/${slug}.json`);
                if (!res.ok) throw new Error('File not found');
                projectData = await res.json();

                renderContent();

                let photos = [];
                if (Array.isArray(projectData.gallery) && projectData.gallery.length > 0) {
                    photos = projectData.gallery;
                } else if (projectData.cover) {
                    photos = [projectData.cover];
                }

                buildGalleries(photos);

            } catch (err) {
                console.error(err);
                document.getElementById('proj-title').textContent = 'Project Not Found';
            }
        }

        window.addEventListener('languageChanged', () => {
            renderContent();
        });

        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>
</html>
