<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Azzurra Zingoni</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Clean Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #050507;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .az-docket-page {
            max-width: 1320px;
            margin: 0 auto;
            padding: 40px 5% 120px;
            position: relative;
        }

        /* Top Return Navigation */
        .az-docket-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 24px;
            margin-bottom: 48px;
        }

        .az-back-btn {
            color: rgba(255, 255, 255, 0.45);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .az-back-btn:hover {
            color: #ffffff;
        }

        .az-docket-tag {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            font-family: monospace;
        }

        /* =========================================
           PROJECT HEADER
           ========================================= */
        .az-docket-header {
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 36px;
            margin-bottom: 44px;
            align-items: start;
        }

        .az-vertical-spine {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: monospace;
            font-size: 11px;
            letter-spacing: 4px;
            color: #00ffcc;
            text-transform: uppercase;
            opacity: 0.85;
            white-space: nowrap;
            padding-top: 6px;
        }

        .az-docket-title-block {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .az-title-acronym {
            font-size: clamp(38px, 6vw, 76px);
            font-weight: 800;
            line-height: 0.95;
            letter-spacing: -1.5px;
            text-transform: uppercase;
            color: #ffffff;
            margin: 0;
        }

        .az-title-expansion {
            font-size: clamp(13px, 1.4vw, 18px);
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.6);
            max-width: 860px;
            line-height: 1.45;
            border-left: 2px solid #00ffcc;
            padding-left: 16px;
        }

        /* =========================================
           SPLIT GRID: COVER + SPECS LEFT / STORY RIGHT
           ========================================= */
        .az-dossier-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 60px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 44px 0 54px;
            margin-bottom: 70px;
            align-items: start;
        }

        .az-cover-pane {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Anchor Cover Image */
        .az-hero-cover-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 5 / 4;
            background: #0d0d12;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .az-hero-cover-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }

        .az-hero-cover-frame:hover img {
            transform: scale(1.03);
        }

        .az-project-summary {
            font-size: 13px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.65);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            padding-left: 14px;
        }

        .az-project-summary p {
            margin: 0 0 8px 0;
        }

        .az-project-summary em,
        .az-project-summary i {
            font-style: italic;
            color: #ffffff;
        }

        /* Curatorial Story Body */
        .az-project-body {
            font-size: 15px;
            font-weight: 400;
            line-height: 1.85;
            color: rgba(255, 255, 255, 0.88);
            max-width: 720px;
        }

        .az-project-body p {
            margin: 0 0 16px 0;
        }

        .az-project-body p:last-child {
            margin-bottom: 0;
        }

        .az-project-body strong,
        .az-project-body b {
            font-weight: 600;
            color: #ffffff;
        }

        .az-project-body em,
        .az-project-body i {
            font-style: italic;
            color: #ffffff;
        }

        /* =========================================
           GALLERY & SCANNER
           ========================================= */
        .az-gallery-area {
            position: relative;
            width: 100%;
        }

        .az-gallery-scanner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 30px 0 65px;
        }

        .az-fingerprint-btn {
            position: relative;
            width: 74px;
            height: 74px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease;
            outline: none;
            padding: 0;
        }

        .az-fingerprint-btn svg {
            width: 42px;
            height: 54px;
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .az-scan-instruction {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .az-scan-beam {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            opacity: 0;
            transform: translateY(-10px);
        }

        .az-gallery-scanner-wrap.is-scanning .az-scan-beam {
            opacity: 1;
            animation: scanAnim 1.2s infinite ease-in-out;
        }

        .az-gallery-scanner-wrap.is-scanning .az-fingerprint-btn {
            border-color: #00ffcc;
            transform: scale(0.96);
        }

        .az-gallery-scanner-wrap.is-scanning .az-fingerprint-btn svg {
            stroke: #00ffcc;
        }

        .az-gallery-scanner-wrap.is-scanning .az-scan-instruction {
            color: #00ffcc;
        }

        @keyframes scanAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(74px); }
            100% { transform: translateY(0px); }
        }

        /* Blurred Preview */
        .az-gallery-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            filter: blur(14px) brightness(0.35);
            opacity: 0.6;
            transition: opacity 0.6s ease;
        }

        @media (max-width: 800px) {
            .az-gallery-preview {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .az-gallery-preview-item {
            position: relative;
            width: 100%;
            aspect-ratio: 5 / 4;
            background: #0d0d12;
            border-radius: 2px;
            overflow: hidden;
            display: flex;
        }

        .az-gallery-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Full Unlocked Gallery */
        .az-artworks.az-gallery-full {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        @media (max-width: 900px) {
            .az-artworks.az-gallery-full {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .az-artworks.az-gallery-full {
                grid-template-columns: 1fr;
            }
        }

        .az-gallery-area.is-unlocked .az-gallery-preview,
        .az-gallery-area.is-unlocked .az-gallery-scanner-wrap {
            display: none;
        }

        .az-gallery-area.is-unlocked .az-artworks.az-gallery-full {
            display: grid;
        }

        .az-artwork {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .az-artwork-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 5 / 4;
            background: #0d0d12;
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            display: flex;
        }

        .az-artwork-frame img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .az-artwork:hover .az-artwork-frame img {
            transform: scale(1.03);
        }

        .az-gallery-navigation-bottom {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 0 20px;
        }

        .az-gallery-navigation-bottom a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .az-gallery-navigation-bottom a:hover {
            color: #00ffcc;
        }

        /* LIGHTBOX VIEWER */
        .az-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .az-viewer.is-open { display: flex; }

        .az-viewer-center {
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .az-viewer-image {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
        }

        .az-viewer-close,
        .az-viewer-prev,
        .az-viewer-next {
            position: absolute;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 32px;
            padding: 16px;
        }

        .az-viewer-close:hover,
        .az-viewer-prev:hover,
        .az-viewer-next:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .az-viewer-close { top: 24px; right: 28px; font-size: 40px; }
        .az-viewer-prev { left: 20px; }
        .az-viewer-next { right: 20px; }

        @media (max-width: 900px) {
            .az-docket-header {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .az-vertical-spine {
                writing-mode: horizontal-tb;
                transform: none;
                padding-top: 0;
            }

            .az-dossier-grid {
                grid-template-columns: 1fr;
                gap: 32px;
                padding: 30px 0 36px;
            }

            .az-cover-pane {
                max-width: 480px;
            }
        }
    </style>
</head>

    <!-- Markdown Parser & Translations -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="i18n.js"></script>

    <!-- 2S CLICK FINGERPRINT EFFECT -->
    <script>
    document.addEventListener("click", function(event) {
        if (event.target.closest("button") || event.target.closest("a") || event.target.closest(".az-artwork")) return;

        const fingerprint = document.createElement("div");
        fingerprint.className = "az-fingerprint";
        fingerprint.style.left = event.clientX + "px";
        fingerprint.style.top = event.clientY + "px";
        fingerprint.innerHTML = `
            <svg viewBox="0 0 60 80" aria-hidden="true">
                <path d="M12 25 C16 8, 44 5, 50 25" />
                <path d="M9 34 C9 13, 48 5, 53 32" />
                <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />
                <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />
                <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />
                <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />
                <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />
                <path d="M47 62 C45 66, 43 69, 41 72" />
            </svg>
        `;

        fingerprint.addEventListener("animationend", () => fingerprint.remove());
        document.body.appendChild(fingerprint);
    });
    </script>

    <script>
        let projectData = null;
        let artworks = [];
        let currentIndex = 0;

        // Extracts path from string, object, or CMS upload wrapper and resolves it safely
       function cleanPath(item) {
            if (!item) return '';

            let raw = '';
            if (typeof item === 'string') {
                raw = item;
            } else if (typeof item === 'object') {
                raw = item.image || item.url || item.photo || item.src || (item.fields ? item.fields.image : '') || '';
            }

            if (!raw || typeof raw !== 'string') return '';
            raw = raw.trim();

            if (raw.startsWith('http://') || raw.startsWith('https://')) {
                return raw;
            }

            // Strip leading slashes
            let cleaned = raw.replace(/^(\.\/|\/)+/, '');

            // Encode spaces and parentheses for static hosting compatibility
            try {
                cleaned = decodeURI(cleaned)
                    .split('/')
                    .map(segment => encodeURIComponent(segment))
                    .join('/');
            } catch (e) {
                cleaned = encodeURI(cleaned);
            }

            return cleaned;
        }

        function renderContent() {
            if (!projectData) return;

            const lang = localStorage.getItem('az_lang') || 'en';
            const rawTitle = (lang === 'it' ? (projectData.title_it || projectData.title_en) : (projectData.title_en || projectData.title_it)) || projectData.title || '';
            const summary = (lang === 'it' ? (projectData.summary_it || projectData.summary_en) : (projectData.summary_en || projectData.summary_it)) || projectData.summary || '';
            const body = (lang === 'it' ? (projectData.body_it || projectData.body_en) : (projectData.body_en || projectData.body_it)) || projectData.body || '';

            // Split title if formatted as "ACRONYM (EXPANSION...)"
            let acronym = rawTitle;
            let expansion = '';
            const match = rawTitle.match(/^([^(]+)(?:\((.*)\))?$/);
            if (match) {
                acronym = match[1].trim();
                expansion = match[2] ? match[2].trim() : '';
            }

            document.title = `${rawTitle} — Azzurra Zingoni`;
            document.getElementById('proj-acronym').textContent = acronym;
            
            const expEl = document.getElementById('proj-expansion');
            if (expansion) {
                expEl.textContent = expansion;
                expEl.style.display = 'block';
            } else {
                expEl.style.display = 'none';
            }

            const categoryEl = document.getElementById('proj-category');
            if (categoryEl) {
                categoryEl.textContent = lang === 'it' ? '// PROGETTO' : '// PROJECT';
            }

            if (projectData.year) {
                document.getElementById('docket-year').textContent = `SERIES // ${projectData.year}`;
            }

            // Render Anchor Cover Picture
            const coverWrap = document.getElementById('hero-cover-wrap');
            if (coverWrap) {
                const coverPath = cleanPath(projectData.cover);
                if (coverPath) {
                    coverWrap.innerHTML = `<img src="${coverPath}" alt="${acronym}">`;
                    coverWrap.style.display = 'flex';
                } else {
                    coverWrap.style.display = 'none';
                }
            }

            const summaryEl = document.getElementById('proj-summary');
            if (summaryEl) {
                summaryEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(summary) : summary;
            }

            const bodyEl = document.getElementById('proj-body');
            if (bodyEl) {
                bodyEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(body) : body;
            }

            const scanInstruction = document.getElementById('gallery-scan-text');
            if (scanInstruction) {
                scanInstruction.textContent = lang === 'it' ? 'TIENI PREMUTO PER SBLOCCARE LA GALLERIA' : 'HOLD TO UNLOCK GALLERY';
            }
        }

        function buildGalleries(photos) {
            const gallerySection = document.getElementById('gallery-start');
            const previewContainer = document.getElementById('gallery-preview');
            const fullContainer = document.getElementById('az-artworks');
            
            previewContainer.innerHTML = '';
            fullContainer.innerHTML = '';

            const validPhotos = (Array.isArray(photos) ? photos : [])
                .map(item => cleanPath(item))
                .filter(url => url.length > 0);

            if (validPhotos.length === 0) {
                if (gallerySection) gallerySection.style.display = 'none';
                return;
            }
            if (gallerySection) gallerySection.style.display = 'block';

            // Preview items (up to 4)
            validPhotos.slice(0, 4).forEach(src => {
                const item = document.createElement('div');
                item.className = 'az-gallery-preview-item';
                item.innerHTML = `<img src="${src}" alt="Preview">`;
                previewContainer.appendChild(item);
            });

            // Full gallery items
            validPhotos.forEach(src => {
                const a = document.createElement('a');
                a.className = 'az-artwork';
                a.href = src;
                a.setAttribute('data-full', src);
                a.innerHTML = `
                    <div class="az-artwork-frame">
                        <img src="${src}" alt="Artwork">
                    </div>
                `;
                fullContainer.appendChild(a);
            });

            const navBottom = document.createElement('div');
            navBottom.className = 'az-gallery-navigation-bottom';
            const lang = localStorage.getItem('az_lang') || 'en';
            navBottom.innerHTML = `<a href="#gallery-start">${lang === 'it' ? 'TORNA ALL\'INIZIO' : 'BACK TO TOP'}</a>`;
            fullContainer.appendChild(navBottom);

            setupGalleryScanner();
            setupViewer();
        }

        function setupGalleryScanner() {
            const scannerWrap = document.getElementById('gallery-scanner');
            const galleryArea = document.querySelector('.az-gallery-area');
            const btn = scannerWrap ? scannerWrap.querySelector('.az-fingerprint-btn') : null;
            let timer = null;

            if (!btn) return;

            const startScan = (e) => {
                e.preventDefault();
                if (galleryArea.classList.contains('is-unlocked')) return;

                scannerWrap.classList.add('is-scanning');
                timer = setTimeout(() => {
                    scannerWrap.classList.remove('is-scanning');
                    galleryArea.classList.add('is-unlocked');
                }, 1200);
            };

            const cancelScan = () => {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                }
                scannerWrap.classList.remove('is-scanning');
            };

            btn.addEventListener('mousedown', startScan);
            btn.addEventListener('touchstart', startScan, { passive: false });
            btn.addEventListener('mouseup', cancelScan);
            btn.addEventListener('mouseleave', cancelScan);
            btn.addEventListener('touchend', cancelScan);
        }

        function setupViewer() {
            artworks = Array.from(document.querySelectorAll('.az-artwork'));
            const viewer = document.getElementById('az-viewer');
            if (!artworks.length || !viewer) return;

            const viewerImage = viewer.querySelector('.az-viewer-image');
            const closeBtn = viewer.querySelector('.az-viewer-close');
            const prevBtn = viewer.querySelector('.az-viewer-prev');
            const nextBtn = viewer.querySelector('.az-viewer-next');

            function showArtwork(index) {
                if (index < 0) index = artworks.length - 1;
                if (index >= artworks.length) index = 0;
                currentIndex = index;

                viewerImage.src = artworks[currentIndex].getAttribute('data-full');
                viewer.classList.add('is-open');
                document.body.style.overflow = 'hidden';
            }

            function closeViewer() {
                viewer.classList.remove('is-open');
                document.body.style.overflow = '';
            }

            artworks.forEach((art, idx) => {
                art.addEventListener('click', (e) => {
                    e.preventDefault();
                    showArtwork(idx);
                });
            });

            closeBtn.onclick = closeViewer;
            prevBtn.onclick = () => showArtwork(currentIndex - 1);
            nextBtn.onclick = () => showArtwork(currentIndex + 1);

            viewer.onclick = (e) => {
                if (e.target === viewer) closeViewer();
            };

            document.onkeydown = (e) => {
                if (!viewer.classList.contains('is-open')) return;
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowLeft') showArtwork(currentIndex - 1);
                if (e.key === 'ArrowRight') showArtwork(currentIndex + 1);
            };
        }

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('id');

            if (!slug) {
                window.location.href = 'work.html';
                return;
            }

            try {
                const res = await fetch(`content/projects/${slug}.json`);
                if (!res.ok) throw new Error('File not found');
                projectData = await res.json();

                renderContent();

                let additionalPhotos = [];
                if (Array.isArray(projectData.gallery)) {
                    additionalPhotos = projectData.gallery;
                }

                buildGalleries(additionalPhotos);

            } catch (err) {
                console.error(err);
                document.getElementById('proj-acronym').textContent = 'Project Not Found';
            }
        }

        window.addEventListener('languageChanged', () => {
            renderContent();
        });

        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>
</html>
