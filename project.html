<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — Azzurra Zingoni</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .az-project-page {
            width: 100%;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
        }

        .az-project-content {
            width: calc(100% - 80px);
            max-width: 1400px;
            margin: 0 auto;
            padding: 50px 0 100px;
        }

        .az-back-btn {
            display: inline-block;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .az-back-btn:hover {
            color: #ffffff;
        }

        /* =========================================
           EXACT EDITORIAL INTRO: CENTERED 34% / 66%
           ========================================= */
        .az-project-intro {
            display: grid;
            grid-template-columns: 34% 66%;
            width: 82%;
            max-width: 1180px;
            margin: 0 auto 30px;
            padding: 40px 0 60px;
            gap: 0;
            align-items: stretch;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* LEFT COLUMN: TITLE WRAPPER */
        .az-project-vertical-title {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* VERTICAL MULTI-LINE TITLE (READS BOTTOM-TO-TOP) */
        .az-project-vertical-title h1 {
            position: absolute;
            top: 20px;
            right: 48px;
            width: auto;
            max-height: 520px;
            margin: 0;
            padding: 0;
            color: #ffffff !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(34px, 3.8vw, 54px);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            white-space: normal;
            transform: rotate(180deg) translateY(-100%);
            transform-origin: top right;
            border: 0;
        }

        /* RIGHT COLUMN: TEXT */
        .az-project-text {
            width: 100%;
            margin: 0;
            padding: 20px 0 20px 24px;
            box-sizing: border-box;
        }

        .az-project-summary,
        .az-project-body {
            width: 100%;
            max-width: 580px;
            margin: 0 0 16px;
            padding: 0;
            color: #ffffff !important;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.75;
        }

        .az-project-summary {
            font-size: 15px;
            font-weight: 600;
        }

        /* COMPACT PARAGRAPH MARGINS */
        .az-project-body p,
        .az-project-summary p {
            margin: 0 0 10px 0 !important;
            color: #ffffff !important;
        }

        .az-project-body p:last-child {
            margin-bottom: 0 !important;
        }

        .az-project-body em,
        .az-project-summary em,
        .az-project-body i,
        .az-project-summary i {
            font-style: italic !important;
            color: #ffffff !important;
        }

        .az-project-body strong,
        .az-project-summary strong,
        .az-project-body b,
        .az-project-summary b {
            font-weight: 700 !important;
            color: #ffffff !important;
        }

        /* =========================================
           RESPONSIVE MOBILE / TABLET FALLBACK
           ========================================= */
        @media (max-width: 900px) {
            .az-project-intro {
                display: flex;
                flex-direction: column;
                align-items: center;
                width: 100%;
                padding: 20px 0 40px;
            }

            .az-project-vertical-title {
                position: static;
                text-align: center;
                margin-bottom: 25px;
            }

            .az-project-vertical-title h1 {
                position: static;
                writing-mode: horizontal-tb;
                transform: none;
                font-size: 32px;
                text-align: center;
                right: auto;
                top: auto;
            }

            .az-project-text {
                padding: 0;
            }
        }

        /* =========================================
           GALLERY AREA & SCANNER
           ========================================= */
        .az-gallery-area {
            position: relative;
            width: 100%;
            max-width: 1300px;
            margin: 40px auto 0;
        }

        .az-gallery-scanner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 40px 0 50px;
        }

        .az-fingerprint-btn {
            position: relative;
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease;
            outline: none;
            padding: 0;
        }

        .az-fingerprint-btn svg {
            width: 40px;
            height: 52px;
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .az-scan-instruction {
            font-size: 11px;
            letter-spacing: 2.5px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .az-scan-beam {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            opacity: 0;
            transform: translateY(-10px);
        }

        .az-gallery-scanner-wrap.is-scanning .az-scan-beam {
            opacity: 1;
            animation: scanAnim 1.2s infinite ease-in-out;
        }

        .az-gallery-scanner-wrap.is-scanning .az-fingerprint-btn {
            border-color: #00ffcc;
            transform: scale(0.96);
        }

        .az-gallery-scanner-wrap.is-scanning .az-fingerprint-btn svg {
            stroke: #00ffcc;
        }

        .az-gallery-scanner-wrap.is-scanning .az-scan-instruction {
            color: #00ffcc;
        }

        @keyframes scanAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(72px); }
            100% { transform: translateY(0px); }
        }

        /* Blurred Preview */
        .az-gallery-preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            filter: blur(14px) brightness(0.4);
            opacity: 0.7;
            transition: opacity 0.6s ease;
        }

        @media (max-width: 800px) {
            .az-gallery-preview {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .az-gallery-preview-item img {
            width: 100%;
            aspect-ratio: 5 / 4;
            object-fit: cover;
            border-radius: 2px;
        }

        /* Full Gallery */
        .az-artworks.az-gallery-full {
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        @media (max-width: 1024px) {
            .az-artworks.az-gallery-full {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .az-artworks.az-gallery-full {
                grid-template-columns: 1fr;
            }
        }

        /* Unlocked State */
        .az-gallery-area.is-unlocked .az-gallery-preview,
        .az-gallery-area.is-unlocked .az-gallery-scanner-wrap {
            display: none;
        }

        .az-gallery-area.is-unlocked .az-artworks.az-gallery-full {
            display: grid;
        }

        .az-artwork {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .az-artwork-frame {
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0d0d12;
            aspect-ratio: 5 / 4;
        }

        .az-artwork-frame img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .az-artwork:hover .az-artwork-frame img {
            transform: scale(1.04);
        }

        .az-gallery-navigation-bottom {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 0 20px;
        }

        .az-gallery-navigation-bottom a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .az-gallery-navigation-bottom a:hover {
            color: #ffffff;
        }

        /* LIGHTBOX VIEWER */
        .az-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .az-viewer.is-open { display: flex; }

        .az-viewer-center {
            max-width: 90vw;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .az-viewer-image {
            max-width: 90vw;
            max-height: 80vh;
            object-fit: contain;
        }

        .az-viewer-caption {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-top: 14px;
            text-align: center;
        }

        .az-viewer-close,
        .az-viewer-prev,
        .az-viewer-next {
            position: absolute;
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            outline: none;
            opacity: 0.6;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 32px;
            padding: 16px;
        }

        .az-viewer-close:hover,
        .az-viewer-prev:hover,
        .az-viewer-next:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .az-viewer-close { top: 24px; right: 28px; font-size: 40px; }
        .az-viewer-prev { left: 20px; }
        .az-viewer-next { right: 20px; }
    </style>
</head>
<body>

    <header class="az-topbar">
        <a class="az-brand" href="index.html">AZZURRA ZINGONI</a>
        <nav class="az-menu">
            <a href="index.html" data-i18n="nav_home">HOME</a>
            <a href="work.html" style="opacity: 1; font-weight: 700;" data-i18n="nav_work">WORK</a>
            <a href="index.html#about" data-i18n="nav_about">ABOUT</a>
            <a href="index.html#contact" data-i18n="nav_contact">CONTACT</a>
            <span class="az-lang-switch">
                <button type="button" class="az-lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                <span class="az-lang-divider">/</span>
                <button type="button" class="az-lang-btn" data-lang="it" onclick="setLanguage('it')">IT</button>
            </span>
        </nav>
    </header>

    <div class="az-project-page">
        <div class="az-project-content">
            <a href="work.html" class="az-back-btn" data-i18n="back_btn">&larr; BACK TO WORK</a>

            <main>
                <!-- EXACT 34% / 66% INTRO -->
                <section class="az-project-intro">
                    <div class="az-project-vertical-title">
                        <h1 id="proj-title">Loading...</h1>
                    </div>

                    <div class="az-project-text">
                        <div id="proj-summary" class="az-project-summary"></div>
                        <div id="proj-body" class="az-project-body"></div>
                    </div>
                </section>

                <!-- GALLERY WITH FINGERPRINT ACCESS -->
                <div class="az-gallery-area" id="gallery-start">
                    <div class="az-gallery-scanner-wrap" id="gallery-scanner">
                        <button class="az-fingerprint-btn" type="button" aria-label="Authenticate Fingerprint">
                            <div class="az-scan-beam"></div>
                            <svg viewBox="0 0 60 80">
                                <path d="M12 25 C16 8, 44 5, 50 25" />
                                <path d="M9 34 C9 13, 48 5, 53 32" />
                                <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />
                                <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />
                                <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />
                                <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />
                                <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />
                            </svg>
                        </button>
                        <span class="az-scan-instruction" id="gallery-scan-text">HOLD TO UNLOCK GALLERY</span>
                    </div>

                    <div class="az-gallery-preview" id="gallery-preview"></div>
                    <section class="az-artworks az-gallery-full" id="az-artworks"></section>
                </div>
            </main>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="az-viewer" id="az-viewer">
        <button class="az-viewer-close" type="button" aria-label="Close">&times;</button>
        <button class="az-viewer-prev" type="button" aria-label="Previous">&larr;</button>
        <div class="az-viewer-center">
            <img class="az-viewer-image" src="" alt="">
            <div class="az-viewer-caption"></div>
        </div>
        <button class="az-viewer-next" type="button" aria-label="Next">&rarr;</button>
    </div>

    <footer class="az-footer">
        <span data-i18n="footer_text">© 2026 AZZURRA ZINGONI</span>
    </footer>

    <!-- Markdown Parser & Translations -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="i18n.js"></script>

    <!-- FINGERPRINT CLICK (AUTO-REMOVAL ON 2S ANIMATION END) -->
    <script>
    document.addEventListener("click", function(event) {
        if (event.target.closest("button") || event.target.closest("a") || event.target.closest(".az-artwork")) return;

        const fingerprint = document.createElement("div");
        fingerprint.className = "az-fingerprint";
        fingerprint.style.left = event.clientX + "px";
        fingerprint.style.top = event.clientY + "px";
        fingerprint.innerHTML = `
            <svg viewBox="0 0 60 80" aria-hidden="true">
                <path d="M12 25 C16 8, 44 5, 50 25" />
                <path d="M9 34 C9 13, 48 5, 53 32" />
                <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />
                <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />
                <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />
                <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />
                <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />
                <path d="M47 62 C45 66, 43 69, 41 72" />
            </svg>
        `;

        fingerprint.addEventListener("animationend", () => fingerprint.remove());
        document.body.appendChild(fingerprint);
    });
    </script>

    <script>
        let projectData = null;
        let artworks = [];
        let currentIndex = 0;

        function cleanPath(path) {
            if (!path) return '';
            if (typeof path === 'object' && path.image) path = path.image;
            return '/' + String(path).replace(/^\.?\//, '');
        }

        function renderContent() {
            if (!projectData) return;

            const lang = localStorage.getItem('az_lang') || 'en';
            const title = (lang === 'it' ? (projectData.title_it || projectData.title_en) : (projectData.title_en || projectData.title_it)) || projectData.title || '';
            const summary = (lang === 'it' ? (projectData.summary_it || projectData.summary_en) : (projectData.summary_en || projectData.summary_it)) || projectData.summary || '';
            const body = (lang === 'it' ? (projectData.body_it || projectData.body_en) : (projectData.body_en || projectData.body_it)) || projectData.body || '';

            document.title = `${title} — Azzurra Zingoni`;
            document.getElementById('proj-title').textContent = title;

            const summaryEl = document.getElementById('proj-summary');
            if (summaryEl) {
                summaryEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(summary) : summary;
            }

            const bodyEl = document.getElementById('proj-body');
            if (bodyEl) {
                bodyEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(body) : body;
            }

            const scanInstruction = document.getElementById('gallery-scan-text');
            if (scanInstruction) {
                scanInstruction.textContent = lang === 'it' ? 'TIENI PREMUTO PER SBLOCCARE LA GALLERIA' : 'HOLD TO UNLOCK GALLERY';
            }
        }

        function buildGalleries(photos) {
            const previewContainer = document.getElementById('gallery-preview');
            const fullContainer = document.getElementById('az-artworks');
            previewContainer.innerHTML = '';
            fullContainer.innerHTML = '';

            photos.slice(0, 4).forEach(src => {
                const item = document.createElement('div');
                item.className = 'az-gallery-preview-item';
                item.innerHTML = `<img src="${cleanPath(src)}" alt="">`;
                previewContainer.appendChild(item);
            });

            photos.forEach(src => {
                const path = cleanPath(src);
                const a = document.createElement('a');
                a.className = 'az-artwork';
                a.href = path;
                a.setAttribute('data-full', path);
                a.innerHTML = `
                    <div class="az-artwork-frame">
                        <img src="${path}" alt="">
                    </div>
                `;
                fullContainer.appendChild(a);
            });

            const navBottom = document.createElement('div');
            navBottom.className = 'az-gallery-navigation-bottom';
            const lang = localStorage.getItem('az_lang') || 'en';
            navBottom.innerHTML = `<a href="#gallery-start">${lang === 'it' ? 'TORNA ALL\'INIZIO' : 'BACK TO TOP'}</a>`;
            fullContainer.appendChild(navBottom);

            setupGalleryScanner();
            setupViewer();
        }

        function setupGalleryScanner() {
            const scannerWrap = document.getElementById('gallery-scanner');
            const galleryArea = document.querySelector('.az-gallery-area');
            const btn = scannerWrap.querySelector('.az-fingerprint-btn');
            let timer = null;

            if (!btn) return;

            const startScan = (e) => {
                e.preventDefault();
                if (galleryArea.classList.contains('is-unlocked')) return;

                scannerWrap.classList.add('is-scanning');
                timer = setTimeout(() => {
                    scannerWrap.classList.remove('is-scanning');
                    galleryArea.classList.add('is-unlocked');
                }, 1200);
            };

            const cancelScan = () => {
                if (timer) {
                    clearTimeout(timer);
                    timer = null;
                }
                scannerWrap.classList.remove('is-scanning');
            };

            btn.addEventListener('mousedown', startScan);
            btn.addEventListener('touchstart', startScan, { passive: false });
            btn.addEventListener('mouseup', cancelScan);
            btn.addEventListener('mouseleave', cancelScan);
            btn.addEventListener('touchend', cancelScan);
        }

        function setupViewer() {
            artworks = Array.from(document.querySelectorAll('.az-artwork'));
            const viewer = document.getElementById('az-viewer');
            if (!artworks.length || !viewer) return;

            const viewerImage = viewer.querySelector('.az-viewer-image');
            const closeBtn = viewer.querySelector('.az-viewer-close');
            const prevBtn = viewer.querySelector('.az-viewer-prev');
            const nextBtn = viewer.querySelector('.az-viewer-next');

            function showArtwork(index) {
                if (index < 0) index = artworks.length - 1;
                if (index >= artworks.length) index = 0;
                currentIndex = index;

                viewerImage.src = artworks[currentIndex].getAttribute('data-full');
                viewer.classList.add('is-open');
                document.body.style.overflow = 'hidden';
            }

            function closeViewer() {
                viewer.classList.remove('is-open');
                document.body.style.overflow = '';
            }

            artworks.forEach((art, idx) => {
                art.addEventListener('click', (e) => {
                    e.preventDefault();
                    showArtwork(idx);
                });
            });

            closeBtn.onclick = closeViewer;
            prevBtn.onclick = () => showArtwork(currentIndex - 1);
            nextBtn.onclick = () => showArtwork(currentIndex + 1);

            viewer.onclick = (e) => {
                if (e.target === viewer) closeViewer();
            };

            document.onkeydown = (e) => {
                if (!viewer.classList.contains('is-open')) return;
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowLeft') showArtwork(currentIndex - 1);
                if (e.key === 'ArrowRight') showArtwork(currentIndex + 1);
            };
        }

        async function loadProjectDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('id');

            if (!slug) {
                window.location.href = 'work.html';
                return;
            }

            try {
                const res = await fetch(`content/projects/${slug}.json`);
                if (!res.ok) throw new Error('File not found');
                projectData = await res.json();

                renderContent();

                let photos = [];
                if (Array.isArray(projectData.gallery) && projectData.gallery.length > 0) {
                    photos = projectData.gallery;
                } else if (projectData.cover) {
                    photos = [projectData.cover];
                }

                buildGalleries(photos);

            } catch (err) {
                console.error(err);
                document.getElementById('proj-title').textContent = 'Project Not Found';
            }
        }

        window.addEventListener('languageChanged', () => {
            renderContent();
        });

        document.addEventListener('DOMContentLoaded', loadProjectDetails);
    </script>
</body>
</html>
