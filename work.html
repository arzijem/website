<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work — Azzurra Zingoni</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .az-work-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 5% 100px;
        }

        .az-work-heading {
            font-size: clamp(32px, 5vw, 56px);
            font-weight: 700;
            letter-spacing: -1.5px;
            margin: 0 0 48px;
            text-transform: uppercase;
        }

        .az-work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        @media (max-width: 1024px) {
            .az-work-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .az-work-grid {
                grid-template-columns: 1fr;
            }
        }

        .az-project-item {
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .az-project-card {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0d0d12;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s ease;
        }

        .az-project-item.is-unlocked .az-project-card {
            cursor: pointer;
        }

        .az-project-item.is-unlocked:hover .az-project-card {
            border-color: rgba(255, 255, 255, 0.45);
        }

        .az-project-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(24px) grayscale(80%) brightness(0.35);
            transform: scale(1.1);
            transition: filter 0.8s ease, transform 0.8s ease;
        }

        .az-project-lock-shield {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            transition: opacity 0.6s ease;
            z-index: 2;
        }

        .az-scanner-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .az-fingerprint-btn {
            position: relative;
            width: 68px;
            height: 68px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.3s ease;
            outline: none;
            padding: 0;
        }

        .az-fingerprint-btn svg {
            width: 38px;
            height: 50px;
            stroke: rgba(255, 255, 255, 0.4);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        .az-scan-instruction {
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        .az-scan-beam {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            opacity: 0;
            transform: translateY(-10px);
        }

        .az-project-item.is-scanning .az-scan-beam {
            opacity: 1;
            animation: scanAnim 1.2s infinite ease-in-out;
        }

        .az-project-item.is-scanning .az-fingerprint-btn {
            border-color: #00ffcc;
            transform: scale(0.96);
        }

        .az-project-item.is-scanning .az-fingerprint-btn svg {
            stroke: #00ffcc;
        }

        .az-project-item.is-scanning .az-scan-instruction {
            color: #00ffcc;
        }

        @keyframes scanAnim {
            0% { transform: translateY(0px); }
            50% { transform: translateY(68px); }
            100% { transform: translateY(0px); }
        }

        /* Unlocked: reveals the photo only */
        .az-project-item.is-unlocked .az-project-bg {
            filter: blur(0px) grayscale(0%) brightness(1);
            transform: scale(1);
        }

        .az-project-item.is-unlocked .az-project-lock-shield {
            opacity: 0;
            pointer-events: none;
        }

        .az-project-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 14px;
        }

        .az-project-title-text {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .az-project-year {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
        }
    </style>
</head>
<body>

    <header class="az-topbar">
        <a class="az-brand" href="index.html">AZZURRA ZINGONI</a>
        <nav class="az-menu">
            <a href="index.html" data-i18n="nav_home">HOME</a>
            <a href="work.html" style="opacity: 1; font-weight: 700;" data-i18n="nav_work">WORK</a>
            <a href="about.html" data-i18n="nav_about">ABOUT</a>
            <a href="contact.html" data-i18n="nav_contact">CONTACT</a>
            <span class="az-lang-switch">
                <button type="button" class="az-lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
                <span class="az-lang-divider">/</span>
                <button type="button" class="az-lang-btn" data-lang="it" onclick="setLanguage('it')">IT</button>
            </span>
        </nav>
    </header>

    <main class="az-work-container">
        <h1 class="az-work-heading" data-i18n="work_title">Selected Work</h1>
        <div class="az-work-grid" id="projects-grid">
            <p style="color: rgba(255,255,255,0.4); text-align: center; grid-column: 1/-1;">Loading projects...</p>
        </div>
    </main>

    <footer class="az-footer">
        <span>© <span class="az-year-green">2026</span> AZZURRA ZINGONI</span>
        <span class="az-footer-right">ALL RIGHTS RESERVED</span>
    </footer>

    <script src="i18n.js"></script>
    <script src="fingerprint.js"></script>

    <!-- FINGERPRINT CLICK SCRIPT (AUTO-REMOVAL ON 2S ANIMATION END) -->
    <script>
    document.addEventListener("click", function(event) {
        if (event.target.closest("button") || event.target.closest("a") || event.target.closest(".az-project-card")) return;

        const fingerprint = document.createElement("div");
        fingerprint.className = "az-fingerprint";
        fingerprint.style.left = event.clientX + "px";
        fingerprint.style.top = event.clientY + "px";
        fingerprint.innerHTML = `
            <svg viewBox="0 0 60 80" aria-hidden="true">
                <path d="M12 25 C16 8, 44 5, 50 25" />
                <path d="M9 34 C9 13, 48 5, 53 32" />
                <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />
                <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />
                <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />
                <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />
                <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />
                <path d="M47 62 C45 66, 43 69, 41 72" />
            </svg>
        `;

        fingerprint.addEventListener("animationend", () => fingerprint.remove());
        document.body.appendChild(fingerprint);
    });
    </script>

    <script>
        const GITHUB_REPO = 'arzijem/website';
        const GITHUB_BRANCH = 'main';
        const PROJECTS_DIR = 'content/projects';

        let cachedProjects = [];

        function cleanPath(path) {
            if (!path) return '';
            return '/' + String(path).replace(/^\.?\//, '');
        }

        function createProjectCard(project, slug) {
            const coverImage = cleanPath(project.cover || '');
            const lang = localStorage.getItem('az_lang') || 'en';
            const title = (lang === 'it' ? (project.title_it || project.title_en) : (project.title_en || project.title_it)) || project.title || 'Untitled Project';
            const year = project.year || '2026';
            const scanLabel = lang === 'it' ? 'TIENI PREMUTO' : 'HOLD TO UNLOCK';

            return `
            <div class="az-project-item" data-slug="${slug}">
                <div class="az-project-card">
                    ${coverImage ? `<img class="az-project-bg" src="${coverImage}" alt="${title}">` : '<div class="az-project-bg" style="background:#111;"></div>'}
                    
                    <div class="az-project-lock-shield">
                        <div class="az-scanner-wrap">
                            <button class="az-fingerprint-btn" type="button" aria-label="Authenticate Fingerprint">
                                <div class="az-scan-beam"></div>
                                <svg viewBox="0 0 60 80">
                                    <path d="M12 25 C16 8, 44 5, 50 25" />
                                    <path d="M9 34 C9 13, 48 5, 53 32" />
                                    <path d="M8 44 C8 18, 48 9, 54 38 C55 44, 54 50, 52 56" />
                                    <path d="M10 53 C13 47, 13 39, 14 33 C17 15, 44 14, 48 34 C50 46, 46 58, 40 68" />
                                    <path d="M13 61 C21 53, 18 40, 21 30 C25 18, 43 21, 44 35 C46 50, 38 63, 31 72" />
                                    <path d="M18 67 C27 58, 24 46, 27 35 C30 25, 40 27, 40 38 C40 51, 33 63, 26 70" />
                                    <path d="M25 69 C31 61, 32 54, 32 45 C32 38, 34 34, 37 36 C40 40, 37 53, 34 59" />
                                </svg>
                            </button>
                            <span class="az-scan-instruction">${scanLabel}</span>
                        </div>
                    </div>
                </div>

                <div class="az-project-meta">
                    <h2 class="az-project-title-text">${title}</h2>
                    <span class="az-project-year">${year}</span>
                </div>
            </div>`;
        }

        function renderGrid() {
            const grid = document.getElementById('projects-grid');
            if (!grid || cachedProjects.length === 0) return;

            grid.innerHTML = cachedProjects.map(({ data, slug }) => createProjectCard(data, slug)).join('');
            setupScanners();
        }

        async function loadProjects() {
            const grid = document.getElementById('projects-grid');
            if (!grid) return;

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${PROJECTS_DIR}?ref=${GITHUB_BRANCH}`;
                const res = await fetch(apiUrl);
                if (!res.ok) throw new Error(`GitHub API error: ${res.status}`);
                const files = await res.json();

                const jsonFiles = files.filter(f => f.name.endsWith('.json'));
                if (jsonFiles.length === 0) {
                    grid.innerHTML = '<p style="color: rgba(255,255,255,0.4); text-align: center; grid-column: 1/-1;">No projects published yet.</p>';
                    return;
                }

                const projectDataPromises = jsonFiles.map(async (file) => {
                    const dataRes = await fetch(file.download_url);
                    const data = await dataRes.json();
                    const slug = file.name.replace('.json', '');
                    return { data, slug };
                });

                cachedProjects = await Promise.all(projectDataPromises);
                renderGrid();
            } catch (err) {
                console.error('Failed to load projects:', err);
                grid.innerHTML = '<p style="color: rgba(255,255,255,0.4); text-align: center; grid-column: 1/-1;">Unable to load projects right now.</p>';
            }
        }

        function setupScanners() {
            document.querySelectorAll('.az-project-item').forEach(item => {
                const btn = item.querySelector('.az-fingerprint-btn');
                const slug = item.getAttribute('data-slug');
                let timer = null;

                // CLICK: Only navigates to project.html if already unlocked
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.az-fingerprint-btn')) return;

                    if (item.classList.contains('is-unlocked')) {
                        window.location.href = `project.html?id=${slug}`;
                    }
                });

                if (!btn) return;

                // HOLD SCANNER: Only unblurs the image on the grid
                const startScan = (e) => {
                    e.preventDefault();
                    if (item.classList.contains('is-unlocked')) return;

                    item.classList.add('is-scanning');
                    timer = setTimeout(() => {
                        item.classList.remove('is-scanning');
                        item.classList.add('is-unlocked'); // Unblurs cover only
                    }, 1200);
                };

                const cancelScan = () => {
                    if (timer) {
                        clearTimeout(timer);
                        timer = null;
                    }
                    item.classList.remove('is-scanning');
                };

                btn.addEventListener('mousedown', startScan);
                btn.addEventListener('touchstart', startScan, { passive: false });
                btn.addEventListener('mouseup', cancelScan);
                btn.addEventListener('mouseleave', cancelScan);
                btn.addEventListener('touchend', cancelScan);
            });
        }

        window.addEventListener('languageChanged', () => {
            renderGrid();
        });

        document.addEventListener('DOMContentLoaded', loadProjects);

        function updateWorkLabels() {
        const lang = localStorage.getItem('az_lang') || 'en';
        const titleEl = document.getElementById('work-title');
        const catEl = document.getElementById('work-category');
        if (titleEl) titleEl.textContent = lang === 'it' ? 'PROGETTI' : 'WORK';
        if (catEl) catEl.textContent = lang === 'it' ? '// PROGETTI' : '// WORK';
    }

    window.addEventListener('languageChanged', updateWorkLabels);
    document.addEventListener('DOMContentLoaded', updateWorkLabels);
    </script>
</body>
</html>
