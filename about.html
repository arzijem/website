<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About — Azzurra Zingoni</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Bar Navigation -->
    <header class="az-topbar">
        <a href="index.html" class="az-brand">AZZURRA ZINGONI</a>
        <nav class="az-menu">
            <a href="index.html" data-i18n="nav_home">HOME</a>
            <a href="work.html" data-i18n="nav_work">WORK</a>
            <a href="about.html" class="active" data-i18n="nav_about">ABOUT</a>
            <a href="contact.html" data-i18n="nav_contact">CONTACT</a>
            <div class="az-lang-switch">
                <button type="button" class="az-lang-btn is-active" id="lang-btn-en">EN</button>
                <span class="az-lang-divider">/</span>
                <button type="button" class="az-lang-btn" id="lang-btn-it">IT</button>
            </div>
        </nav>
        <button class="az-menu-button" aria-label="Toggle menu" type="button">
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- Mobile Drawer Menu -->
    <aside class="az-mobile-menu">
        <nav class="az-mobile-links">
            <a href="index.html" data-i18n="nav_home">HOME</a>
            <a href="work.html" data-i18n="nav_work">WORK</a>
            <a href="about.html" data-i18n="nav_about">ABOUT</a>
            <a href="contact.html" data-i18n="nav_contact">CONTACT</a>
        </nav>
        <div class="az-mobile-languages">
            <span id="mobile-lang-en">EN</span>
            <span>/</span>
            <span id="mobile-lang-it">IT</span>
        </div>
    </aside>

    <!-- Main About Page -->
    <main class="az-about-page">
        <!-- Docket Header with Rotated Green Badge -->
        <header class="az-docket-banner">
            <div class="az-docket-badge">
                <span id="about-category">// PROFILE</span>
            </div>
            <div class="az-docket-title-wrap">
                <h1 id="about-title" class="az-docket-heading">ABOUT</h1>
            </div>
        </header>

        <!-- Main Content Area: Image Column + Text Column -->
        <section class="az-about-grid">
            <!-- Portrait Column -->
            <aside class="az-about-media-col">
                <div class="az-about-frame">
                    <img id="about-img" src="" alt="Azzurra Zingoni" style="display:none;" />
                    <div class="az-frame-corner az-fc-tl"></div>
                    <div class="az-frame-corner az-fc-tr"></div>
                    <div class="az-frame-corner az-fc-bl"></div>
                    <div class="az-frame-corner az-fc-br"></div>
                </div>
                <div class="az-about-meta">
                    <span>IDENTITY //</span>
                    <span>AZZURRA ZINGONI</span>
                </div>
            </aside>

            <!-- Biography Column -->
            <article class="az-about-text-col">
                <div id="about-body" class="az-about-markdown"></div>

                <div class="az-about-footer-sig">
                    <div class="az-sig-line"></div>
                    <span class="az-sig-date">// PORTFOLIO ARCHIVE</span>
                </div>
            </article>
        </section>
    </main>

    <!-- Original Two-Sided Footer Structure -->
    <footer class="az-footer">
        <span data-i18n="footer_text">© 2026 AZZURRA ZINGONI</span>
        <span class="az-footer-right">ALL RIGHTS RESERVED</span>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="i18n.js"></script>

    <script>
        let aboutData = null;

        // Interactive Fingerprint Click Stamp
        function initFingerprintStamps() {
            const svgMarkup = `
                <svg viewBox="0 0 24 24">
                    <path d="M12 1a10 10 0 0 0-10 10c0 3.5 1.5 6.5 4 8.5"/>
                    <path d="M12 5a6 6 0 0 0-6 6c0 2 1 4 2.5 5.5"/>
                    <path d="M12 9a2 2 0 0 0-2 2c0 1 .5 2 1.5 2.5"/>
                    <path d="M12 13a2 2 0 0 1 2-2 2 2 0 0 1 2 2c0 2-1.5 4-3 5.5"/>
                    <path d="M16 7a6 6 0 0 1 2 4c0 3-1.5 5.5-3.5 7"/>
                    <path d="M20 11c0 4.5-2.5 8-5.5 10"/>
                </svg>
            `;

            window.addEventListener('click', (e) => {
                if (e.target.closest('a, button, input, textarea')) return;

                const stamp = document.createElement('div');
                stamp.className = 'az-fingerprint';
                stamp.innerHTML = svgMarkup;
                stamp.style.left = `${e.clientX}px`;
                stamp.style.top = `${e.clientY}px`;

                document.body.appendChild(stamp);

                setTimeout(() => {
                    stamp.remove();
                }, 2000);
            });
        }

        // Mobile Menu Drawer Toggle
        const menuBtn = document.querySelector('.az-menu-button');
        if (menuBtn) {
            menuBtn.addEventListener('click', () => {
                document.body.classList.toggle('az-menu-open');
            });
        }

        // Render About Page Data & Language Switching
        function renderAbout() {
            if (!aboutData) return;
            const lang = localStorage.getItem('az_lang') || 'en';

            const titleEl = document.getElementById('about-title');
            if (titleEl) {
                titleEl.textContent = lang === 'it' ? 'CHI SONO' : 'ABOUT';
            }

            const catEl = document.getElementById('about-category');
            if (catEl) {
                catEl.textContent = lang === 'it' ? '// PROFILO' : '// PROFILE';
            }

            const textContent = lang === 'it' 
                ? (aboutData.text_it || aboutData.text_en) 
                : (aboutData.text_en || aboutData.text_it);

            const bodyEl = document.getElementById('about-body');
            if (bodyEl && textContent) {
                bodyEl.innerHTML = typeof marked !== 'undefined' ? marked.parse(textContent) : textContent;
            }

            const imgEl = document.getElementById('about-img');
            if (imgEl && aboutData.photo) {
                let photoSrc = String(aboutData.photo).trim();
                if (!photoSrc.startsWith('http://') && !photoSrc.startsWith('https://')) {
                    photoSrc = photoSrc.replace(/^(\.\/|\/)+/, '');
                    if (!photoSrc.startsWith('assets/uploads/')) {
                        photoSrc = 'assets/uploads/' + photoSrc;
                    }
                    photoSrc = '/' + photoSrc;
                }
                imgEl.src = photoSrc;
                imgEl.style.display = 'block';
            }
        }

        async function loadAbout() {
            try {
                const res = await fetch('content/about.json');
                if (!res.ok) throw new Error('Could not load content/about.json');
                aboutData = await res.json();
                renderAbout();
            } catch (err) {
                console.error('About loading error:', err);
            }
        }

        window.addEventListener('languageChanged', renderAbout);
        document.addEventListener('DOMContentLoaded', () => {
            loadAbout();
            initFingerprintStamps();
        });
    </script>
</body>
</html>
